name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # npm client only for the final publish (`bun publish` doesn't support
      # Trusted Publishing OIDC). Authenticates with the NPM_TOKEN secret
      # (Automation-type token). Everything else is bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # Root and pi-extension resolve store types via dist (not committed): build it first
      - run: bun run --cwd packages/store build
      - run: bun run typecheck
      - run: bun run --cwd packages/store typecheck
      - run: bun run --cwd packages/pi-extension typecheck
      - run: bun run build
      - run: bun run --cwd packages/pi-extension build
      # Gate: e2e + unit tests (includes store -> symlink -> server -> API).
      # If it fails, nothing is published.
      - run: bun test src/ && bunx vitest run packages/
      # Topological order: store -> omp -> cli. Skip what's already published so
      # single-package patch releases don't fail with 403.
      - run: |
          for spec in "packages/store:@tarileo/artifact-store" "packages/pi-extension:@tarileo/artifact-omp" ".:@tarileo/artifacts-cli"; do
            dir="${spec%%:*}"; pkg="${spec##*:}"; short="${pkg##*/}"
            ver=$(cd "$dir" && bun pm pkg get version | tr -d '"')
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "skip $pkg@$ver (already published)"
              continue
            fi
            bun pm pack --cwd "$dir"
            npm publish "$dir"/tarileo-"$short"-*.tgz --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

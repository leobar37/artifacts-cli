name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Cliente npm solo para el publish final (`bun publish` no soporta
      # provenance/OIDC). Autentica con el secret NPM_TOKEN (token tipo
      # Automation de npm). Todo lo demás es bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # pi-extension resuelve los tipos del store vía dist: hay que compilarlo antes
      - run: bun run --cwd packages/store build
      - run: bun run --cwd packages/store typecheck
      - run: bun run --cwd packages/pi-extension typecheck
      - run: bun run build
      - run: bun run --cwd packages/pi-extension build
      # Orden topológico: store -> omp -> cli.
      - run: bun pm pack --cwd packages/store
      - run: npm publish ./packages/store/tarileo-artifact-store-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun pm pack --cwd packages/pi-extension
      - run: npm publish ./packages/pi-extension/tarileo-artifact-omp-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun pm pack
      - run: npm publish ./tarileo-artifacts-cli-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Cliente npm solo para el publish final (`bun publish` no soporta
      # Trusted Publishing OIDC). Autentica con el secret NPM_TOKEN
      # (token tipo Automation). Todo lo demás es bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # El root y pi-extension resuelven tipos del store vía dist (no se commitea): compilarlo antes
      - run: bun run --cwd packages/store build
      - run: bun run typecheck
      - run: bun run --cwd packages/store typecheck
      - run: bun run --cwd packages/pi-extension typecheck
      - run: bun run build
      - run: bun run --cwd packages/pi-extension build
      # Gate: e2e + unitarios (incluye store -> symlink -> server -> API).
      # Si falla, no se publica nada.
      - run: bun test src/ && bunx vitest run packages/
      # Orden topológico: store -> omp -> cli. Salta lo ya publicado para
      # que los patch releases de un solo paquete no fallen con 403.
      - run: |
          for spec in "packages/store:@tarileo/artifact-store" "packages/pi-extension:@tarileo/artifact-omp" ".:@tarileo/artifacts-cli"; do
            dir="${spec%%:*}"; pkg="${spec##*:}"; short="${pkg##*/}"
            ver=$(cd "$dir" && bun pm pkg get version | tr -d '"')
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "skip $pkg@$ver (already published)"
              continue
            fi
            bun pm pack --cwd "$dir"
            npm publish "$dir"/tarileo-"$short"-*.tgz --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # El root typecheckea el e2e que importa el store: compilarlo antes (dist no se commitea)
      - run: bun run --cwd packages/store build
      - run: bun run typecheck
      - run: bun run --cwd packages/store typecheck
      - run: bun run --cwd packages/pi-extension typecheck
      - run: bun run build
      - run: bun run --cwd packages/pi-extension build
      - run: bun test src/ && bunx vitest run packages/
